services:
  cd-solutions:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-prod}
        REVISION: ${REVISION:-prod}
        CONTACT_EMAIL: ${CONTACT_EMAIL:-}
        CONTACT_PHONE: ${CONTACT_PHONE:-}
        CONTACT_ADDRESS: ${CONTACT_ADDRESS:-}
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      CONTACT_PHONE: ${CONTACT_PHONE:-}
      CONTACT_ADDRESS: ${CONTACT_ADDRESS:-}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.cd-solutions.rule=Host(`${WEB_HOST:-cd-solutions.example.com}`)"
      - "traefik.http.routers.cd-solutions.entrypoints=websecure"
      - "traefik.http.routers.cd-solutions.tls=true"
      - "traefik.http.routers.cd-solutions.tls.certresolver=letsencrypt"
      - "traefik.http.services.cd-solutions.loadbalancer.server.port=3000"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
